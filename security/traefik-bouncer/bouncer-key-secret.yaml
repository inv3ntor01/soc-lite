# Generate key with: kubectl exec -n security deploy/crowdsec -- cscli bouncers add traefik -o raw > bouncer-key.txt
# Then create secret:
# kubectl -n security create secret generic crowdsec-bouncer-key --from-file=BOUNCER_KEY_traefik=bouncer-key.txt
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer-key
  namespace: traefik
type: Opaque
# data:
#   BOUNCER_KEY_traefik: <base64-encoded-key>
