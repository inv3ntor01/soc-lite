apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # kubelet + node metrics (k3s)
      - job_name: kubelet
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: "(.*):10250"
            replacement: "$1:10250"
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Traefik metrics (requires --metrics.prometheus=true on Traefik)
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["traefik"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: "traefik"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:8080"

      # CrowdSec metrics (requires prometheus.enabled: true)
      - job_name: crowdsec
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["security"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: "crowdsec"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:6060"
